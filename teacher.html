<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>課堂翻譯 · 老師端</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Nunito:wght@400;600;700&display=swap">
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<!-- 課堂翻譯設定（填好 config.js 後推送到 GitHub） -->
<script src="config.js"></script>
<style>
  :root {
    --bg:        #FEF3FF;
    --surface:   #FFFFFF;
    --surface2:  #FFF8FE;
    --border:    #F0C6FF;
    --text:      #2D1B69;
    --muted:     #9C7EC2;
    --faint:     #EDD5FF;

    --pink:      #FF6BAE;
    --purple:    #C084FC;
    --blue:      #60A5FA;
    --cyan:      #22D3EE;
    --yellow:    #FFD93D;
    --mint:      #34D399;
    --coral:     #FB7185;

    --grad-main: linear-gradient(135deg, #FF6BAE 0%, #C084FC 100%);
    --grad-blue: linear-gradient(135deg, #60A5FA 0%, #818CF8 100%);
    --grad-warm: linear-gradient(135deg, #FFD93D 0%, #FB923C 100%);
    --grad-mint: linear-gradient(135deg, #34D399 0%, #22D3EE 100%);

    --display: 'M PLUS Rounded 1c', 'Helvetica Neue', sans-serif;
    --body:    'Nunito', 'Helvetica Neue', sans-serif;
    --r-lg: 20px;
    --r-md: 14px;
    --r-sm: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 10% 20%, rgba(255,107,174,.12) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 80%, rgba(192,132,252,.12) 0%, transparent 50%);
    color: var(--text);
    font-family: var(--body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 60px;
  }

  /* ── Decorative stars ── */
  body::before, body::after {
    content: '';
    position: fixed;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Top bar ── */
  .topbar {
    width: 100%;
    max-width: 660px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    position: relative;
    z-index: 1;
  }

  .logo {
    font-family: var(--display);
    font-size: 15px;
    font-weight: 800;
    background: var(--grad-main);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .role-chip {
    font-family: var(--display);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 20px;
    background: var(--grad-main);
    color: #fff;
    letter-spacing: .04em;
    box-shadow: 0 2px 12px rgba(255,107,174,.35);
  }

  /* ── Main card ── */
  .card {
    width: 100%;
    max-width: 660px;
    background: var(--surface);
    border-radius: 24px;
    border: 2px solid var(--border);
    box-shadow: 0 8px 40px rgba(192,132,252,.15);
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  /* Gradient top stripe */
  .card::before {
    content: '';
    display: block;
    height: 6px;
    background: var(--grad-main);
  }

  .card-header {
    padding: 28px 32px 22px;
    border-bottom: 2px solid var(--faint);
    position: relative;
  }

  .header-deco {
    position: absolute;
    top: 18px;
    right: 28px;
    font-size: 28px;
    opacity: .6;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-5px); }
  }

  h1 {
    font-family: var(--display);
    font-size: 24px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 6px;
    text-wrap: balance;
  }

  h1 span {
    background: var(--grad-main);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 14px;
    color: var(--muted);
    font-weight: 600;
  }

  /* ── Session banner ── */
  .session-bar {
    margin: 16px 32px 0;
    padding: 12px 18px;
    background: linear-gradient(135deg, rgba(255,217,61,.15), rgba(251,146,60,.1));
    border: 2px solid rgba(255,217,61,.4);
    border-radius: var(--r-md);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  .session-info {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--display);
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }

  .session-code {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .12em;
    background: var(--grad-warm);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .student-count {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--mint);
    background: rgba(52,211,153,.12);
    border: 1.5px solid rgba(52,211,153,.3);
    padding: 4px 12px;
    border-radius: 20px;
  }

  .count-num {
    font-family: var(--display);
    font-size: 16px;
    font-weight: 800;
  }

  /* ── Controls ── */
  .controls {
    padding: 28px 32px;
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 2px solid var(--faint);
    flex-wrap: wrap;
  }

  /* BIG mic button */
  .mic-btn {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: none;
    background: var(--grad-blue);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 6px 24px rgba(96,165,250,.4);
    outline: none;
  }

  .mic-btn:hover:not(:disabled) {
    transform: scale(1.06);
    box-shadow: 0 10px 32px rgba(96,165,250,.55);
  }

  .mic-btn.recording {
    background: var(--grad-main);
    box-shadow: 0 6px 28px rgba(255,107,174,.5);
    animation: mic-pulse 1.1s ease infinite;
  }

  .mic-btn.recording::before,
  .mic-btn.recording::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    border: 3px solid var(--pink);
    animation: ring-out 1.4s ease-out infinite;
    opacity: 0;
  }

  .mic-btn.recording::before { width: 110px; height: 110px; animation-delay: 0s; }
  .mic-btn.recording::after  { width: 136px; height: 136px; animation-delay: .35s; border-color: var(--purple); }

  @keyframes ring-out {
    0%   { transform: scale(.8); opacity: .8; }
    100% { transform: scale(1);  opacity: 0; }
  }

  @keyframes mic-pulse {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.04); }
  }

  .mic-btn:disabled { opacity: .4; cursor: not-allowed; }

  .mic-btn svg { width: 34px; height: 34px; }

  /* Controls right side */
  .controls-right {
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
    min-width: 180px;
  }

  /* Status pill */
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 20px;
    font-family: var(--display);
    font-size: 13px;
    font-weight: 700;
    width: fit-content;
    transition: all .2s;
  }

  .status-pill.idle      { background: var(--faint); color: var(--muted); }
  .status-pill.listening { background: linear-gradient(135deg,rgba(255,107,174,.18),rgba(192,132,252,.18)); color: var(--pink); border: 1.5px solid rgba(255,107,174,.35); }
  .status-pill.done      { background: rgba(52,211,153,.15); color: #059669; border: 1.5px solid rgba(52,211,153,.3); }
  .status-pill.error     { background: rgba(251,113,133,.15); color: #e11d48; border: 1.5px solid rgba(251,113,133,.3); }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  .status-pill.listening .status-dot { animation: blink .7s ease infinite; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: .2; }
  }

  /* Controls row bottom */
  .controls-bottom {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .lang-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .lang-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    font-family: var(--display);
    letter-spacing: .04em;
    white-space: nowrap;
  }

  select {
    background: var(--surface2);
    border: 2px solid var(--faint);
    color: var(--text);
    font-family: var(--body);
    font-weight: 600;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 10px;
    outline: none;
    cursor: pointer;
    transition: border-color .15s;
  }

  select:focus { border-color: var(--purple); }

  .stop-btn {
    display: none;
    padding: 8px 18px;
    border-radius: 20px;
    background: rgba(251,113,133,.12);
    border: 2px solid rgba(251,113,133,.35);
    color: var(--coral);
    font-size: 13px;
    font-family: var(--display);
    font-weight: 700;
    cursor: pointer;
    transition: all .15s;
  }

  .stop-btn:hover { background: rgba(251,113,133,.22); }
  .stop-btn.visible { display: flex; align-items: center; gap: 6px; }

  /* ── Transcript ── */
  .transcript {
    padding: 24px 32px;
    min-height: 240px;
    position: relative;
  }

  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--faint);
    pointer-events: none;
    transition: opacity .3s;
    text-align: center;
  }

  .placeholder-icon {
    font-size: 48px;
    animation: float 4s ease-in-out infinite;
  }

  .placeholder-text {
    font-family: var(--display);
    font-size: 15px;
    font-weight: 700;
    color: var(--faint);
    line-height: 1.5;
  }

  /* interim text */
  .interim-text {
    font-family: var(--display);
    font-size: clamp(18px, 3vw, 24px);
    font-weight: 700;
    color: var(--muted);
    line-height: 1.4;
    margin-bottom: 16px;
    min-height: 1.4em;
    font-style: italic;
  }

  /* final lines — speech bubble style */
  .final-feed {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bubble {
    background: var(--surface2);
    border: 2px solid var(--faint);
    border-left: 5px solid var(--pink);
    border-radius: 0 var(--r-md) var(--r-md) var(--r-md);
    padding: 12px 18px;
    font-family: var(--display);
    font-size: clamp(17px, 2.8vw, 22px);
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
    animation: pop-in .25s cubic-bezier(.34,1.56,.64,1) both;
    position: relative;
  }

  .bubble::before {
    content: '';
    position: absolute;
    top: -2px;
    left: -16px;
    width: 12px;
    height: 12px;
    background: var(--pink);
    clip-path: polygon(100% 0, 100% 100%, 0 0);
  }

  .bubble:nth-child(2n)   { border-left-color: var(--purple); }
  .bubble:nth-child(2n)::before { background: var(--purple); }
  .bubble:nth-child(3n)   { border-left-color: var(--blue); }
  .bubble:nth-child(3n)::before { background: var(--blue); }

  @keyframes pop-in {
    from { opacity: 0; transform: scale(.92) translateY(6px); }
    to   { opacity: 1; transform: scale(1)   translateY(0); }
  }

  /* ── Footer ── */
  .card-footer {
    padding: 14px 32px;
    border-top: 2px solid var(--faint);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .clear-btn {
    font-size: 13px;
    font-family: var(--display);
    font-weight: 700;
    color: var(--muted);
    background: none;
    border: 2px solid var(--faint);
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all .15s;
  }

  .clear-btn:hover { color: var(--text); border-color: var(--border); }

  .char-count {
    font-family: var(--display);
    font-size: 13px;
    font-weight: 700;
    color: var(--faint);
  }

  /* ── Student page link ── */
  .student-link-bar {
    width: 100%;
    max-width: 660px;
    margin-top: 16px;
    padding: 14px 22px;
    background: rgba(52,211,153,.1);
    border: 2px solid rgba(52,211,153,.3);
    border-radius: var(--r-md);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    z-index: 1;
    position: relative;
  }

  .student-link-text {
    font-family: var(--display);
    font-size: 13px;
    font-weight: 700;
    color: #065f46;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .student-url {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    font-weight: 400;
    background: rgba(52,211,153,.15);
    padding: 3px 8px;
    border-radius: 6px;
    color: #059669;
    word-break: break-all;
  }

  .copy-btn {
    padding: 7px 16px;
    border-radius: 20px;
    background: var(--grad-mint);
    border: none;
    color: #fff;
    font-family: var(--display);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 3px 10px rgba(52,211,153,.3);
    transition: transform .15s, box-shadow .15s;
  }

  .copy-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(52,211,153,.4); }

  /* ── No-support warning ── */
  .browser-warn {
    width: 100%; max-width: 660px;
    margin-top: 16px;
    padding: 14px 20px;
    background: rgba(251,113,133,.1);
    border: 2px solid rgba(251,113,133,.3);
    border-radius: var(--r-md);
    font-family: var(--display);
    font-size: 13px;
    font-weight: 700;
    color: #be185d;
    display: none;
    z-index: 1;
    position: relative;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>

<!-- Firebase 未設定時顯示提示 -->
<div id="fbWarnBar" style="display:none; width:100%; max-width:660px; margin-bottom:16px; padding:14px 20px; background:rgba(255,107,174,.12); border:2px solid rgba(255,107,174,.45); border-radius:14px; font-family:'M PLUS Rounded 1c',sans-serif; font-size:13px; font-weight:700; color:#be185d; z-index:1; position:relative; line-height:1.6;">
  ⚠️ Firebase 尚未設定 — 語音辨識可用，但<strong>學生端無法收到翻譯</strong><br>
  <span style="font-weight:500; font-size:12px; color:#9f1239;">請編輯 <code style="background:rgba(190,24,93,.1);padding:1px 5px;border-radius:4px;">config.js</code>，填入 Firebase 設定後推送到 GitHub，即可啟用即時翻譯。<a href="https://console.firebase.google.com" target="_blank" style="color:#be185d;margin-left:6px;">開啟 Firebase Console →</a></span>
</div>

<div class="topbar">
  <div class="logo">✦ 課堂即時翻譯</div>
  <div class="role-chip">🎙 老師端</div>
</div>

<div class="card">

  <div class="card-header">
    <div class="header-deco">🌸</div>
    <h1>開始<span>語音辨識</span></h1>
    <p class="subtitle">按麥克風後說話，學生即時看到翻譯 ✨</p>

    <div class="session-bar">
      <div class="session-info">
        <span>📋 Session 代碼</span>
        <span class="session-code" id="sessionCode">——</span>
      </div>
      <div class="student-count">
        <span>👥</span>
        <span class="count-num" id="studentCount">0</span>
        <span>位學生已加入</span>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="mic-btn" id="micBtn" title="開始錄音">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>

    <div class="controls-right">
      <div class="status-pill idle" id="statusPill">
        <span class="status-dot"></span>
        <span id="statusText">等待開始 ⭐</span>
      </div>

      <div class="controls-bottom">
        <div class="lang-wrap">
          <span class="lang-label">辨識語言</span>
          <select id="langSelect">
            <option value="zh-TW">中文（繁體）</option>
            <option value="zh-CN">中文（簡體）</option>
            <option value="en-US">English</option>
            <option value="ja-JP">日本語</option>
          </select>
        </div>
        <button class="stop-btn" id="stopBtn">⬛ 停止</button>
      </div>
    </div>
  </div>

  <!-- Transcript -->
  <div class="transcript" id="transcriptArea">
    <div class="placeholder" id="placeholder">
      <div class="placeholder-icon">🎤</div>
      <div class="placeholder-text">按下麥克風，開口說話<br>辨識結果會出現在這裡 ✦</div>
    </div>
    <div class="interim-text" id="interimText"></div>
    <div class="final-feed" id="finalFeed"></div>
  </div>

  <div class="card-footer">
    <button class="clear-btn" id="clearBtn">🗑 清除</button>
    <div class="char-count" id="charCount">0 字</div>
  </div>

</div>

<!-- Student link bar -->
<div class="student-link-bar">
  <div class="student-link-text">
    🌟 學生加入連結：
    <span class="student-url" id="studentUrl">載入中…</span>
  </div>
  <button class="copy-btn" id="copyBtn">📋 複製連結</button>
</div>

<div class="browser-warn" id="browserWarn">
  ⚠️ 請使用 <strong>Chrome 或 Edge（桌機版）</strong> 才能使用語音辨識功能！
</div>

<script>
  // ── Firebase 即時推送 ───────────────────────────────
  let _db = null;

  function initFirebase() {
    const cfg = (typeof FIREBASE_CONFIG !== 'undefined') ? FIREBASE_CONFIG : null;
    const ready = cfg && cfg.databaseURL && !cfg.databaseURL.includes('YOUR_PROJECT');
    if (!ready) {
      document.getElementById('fbWarnBar').style.display = 'block';
      return;
    }
    try {
      if (!firebase.apps.length) firebase.initializeApp(cfg);
      _db = firebase.database();
      // 監聽學生人數
      _db.ref(`classroom/${SESSION_ID}/students`).on('value', snap => {
        document.getElementById('studentCount').textContent = snap.numChildren();
      });
    } catch (e) {
      console.error('Firebase init error:', e);
      document.getElementById('fbWarnBar').style.display = 'block';
    }
  }

  function pushSpeech(text) {
    if (!_db || !text) return;
    _db.ref(`classroom/${SESSION_ID}/messages`).push({
      text,
      ts: firebase.database.ServerValue.TIMESTAMP
    });
  }

  // ── Session setup ──────────────────────────────────
  const params    = new URLSearchParams(location.search);
  let SESSION_ID  = params.get('session') || Math.random().toString(36).slice(2,8).toUpperCase();

  document.getElementById('sessionCode').textContent = SESSION_ID;

  const studentBase = location.origin + location.pathname.replace('teacher.html','') + 'student.html';
  const studentLink = `${studentBase}?session=${SESSION_ID}`;
  document.getElementById('studentUrl').textContent = studentLink;

  document.getElementById('copyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(studentLink).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✅ 已複製！';
      setTimeout(() => btn.textContent = '📋 複製連結', 2000);
    });
  });

  // ── Firebase 初始化 ────────────────────────────────
  initFirebase();

  // ── Speech Recognition ──────────────────────────────
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn    = document.getElementById('micBtn');
  const stopBtn   = document.getElementById('stopBtn');
  const statusPill = document.getElementById('statusPill');
  const statusText = document.getElementById('statusText');
  const interimEl  = document.getElementById('interimText');
  const finalFeed  = document.getElementById('finalFeed');
  const placeholder = document.getElementById('placeholder');
  const clearBtn   = document.getElementById('clearBtn');
  const charCountEl = document.getElementById('charCount');
  const langSelect  = document.getElementById('langSelect');

  let recognition = null;
  let isRecording = false;
  let totalChars  = 0;

  if (!SpeechRecognition) {
    document.getElementById('browserWarn').style.display = 'block';
    micBtn.disabled = true;
    setStatus('error', '不支援的瀏覽器 😢');
  }

  function setStatus(state, msg) {
    statusPill.className = 'status-pill ' + state;
    statusText.textContent = msg;
  }

  function buildRecognition() {
    const r = new SpeechRecognition();
    r.lang           = langSelect.value;
    r.continuous     = true;
    r.interimResults = true;

    r.onstart = () => {
      isRecording = true;
      micBtn.classList.add('recording');
      stopBtn.classList.add('visible');
      setStatus('listening', '正在聆聽中… 🎙');
      placeholder.style.opacity = '0';
    };

    r.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          appendBubble(t.trim());
          pushSpeech(t.trim());
          interim = '';
        } else {
          interim += t;
        }
      }
      interimEl.textContent = interim;
    };

    r.onerror = (e) => {
      const msgs = {
        'not-allowed': '請允許麥克風權限 🙏',
        'no-speech':   '沒有偵測到聲音',
        'network':     '網路錯誤',
      };
      setStatus('error', msgs[e.error] || '錯誤：' + e.error);
      stopRecording();
    };

    r.onend = () => {
      if (isRecording) { try { r.start(); } catch(e) {} }
      else { setStatus('done', '辨識完成 ✅'); interimEl.textContent = ''; }
    };

    return r;
  }

  function appendBubble(text) {
    if (!text) return;
    const div = document.createElement('div');
    div.className = 'bubble';
    div.textContent = text;
    finalFeed.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    totalChars += text.length;
    charCountEl.textContent = totalChars + ' 字';
  }

  function startRecording() {
    if (isRecording) return;
    recognition = buildRecognition();
    try { recognition.start(); } catch(e) { setStatus('error', '無法啟動'); }
  }

  function stopRecording() {
    isRecording = false;
    micBtn.classList.remove('recording');
    stopBtn.classList.remove('visible');
    interimEl.textContent = '';
    if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
    if (finalFeed.children.length === 0) { placeholder.style.opacity = '1'; setStatus('idle', '等待開始 ⭐'); }
  }

  micBtn.addEventListener('click', () => { if (!isRecording) startRecording(); });
  stopBtn.addEventListener('click', () => { stopRecording(); setStatus('done', '辨識完成 ✅'); });
  clearBtn.addEventListener('click', () => {
    finalFeed.innerHTML = ''; interimEl.textContent = '';
    totalChars = 0; charCountEl.textContent = '0 字';
    if (!isRecording) { placeholder.style.opacity = '1'; setStatus('idle', '等待開始 ⭐'); }
  });
  langSelect.addEventListener('change', () => {
    if (isRecording) { stopRecording(); setTimeout(startRecording, 200); }
  });
</script>
</body>
</html>
